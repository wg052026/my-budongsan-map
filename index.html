    document.getElementById("xlsxFile").addEventListener("change", function(e){
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        try {
          var wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
          var ws = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws, {defval:""});
          if (!rows.length){ alert("엑셀에서 읽은 행이 없습니다."); return; }

          // 컬럼명 유연 매칭
          function pick(r, keys){ for (var i=0;i<keys.length;i++){ if (r[keys[i]]!==undefined && r[keys[i]]!=="") return r[keys[i]]; } return ""; }

          var parsed=[], skipped=0, seqCounter=0;
          rows.forEach(function(r){
            seqCounter++;
            var name = String(pick(r,["이름","name","아파트명","단지명"])).trim();
            var addr = String(pick(r,["주소","addr","address","소재지"])).trim();
            var lat = parseFloat(pick(r,["위도","lat","latitude"]));
            var lng = parseFloat(pick(r,["경도","lng","longitude"]));
            // 이름 없거나, (좌표도 없고 주소도 없으면) 못 넣음
            if (!name || (isNaN(lat)&&isNaN(lng)&&!addr)){ skipped++; return; }
            var scoreRaw = pick(r,["점수","score","등급"]);
            var score = (scoreRaw===""||scoreRaw==null)?0:parseInt(scoreRaw,10); if(isNaN(score))score=0;
            var seqRaw = parseInt(pick(r,["번호","seq","순번"]),10);
            parsed.push({
              kind: String(pick(r,["종류","kind"])||"apt").trim()||"apt",
              name: name,
              addr: addr,
              disp: String(pick(r,["표시명","disp"])||"").trim(),
              score: Math.max(0,Math.min(6,score)),
              py: String(pick(r,["평","py"])||"").trim(),
              price: String(pick(r,["실거래가","price","가격"])||"").trim(),
              land: parseFloat(pick(r,["대지지분","land"]))||0,
              jong: String(pick(r,["종(용도)","종","jong"])||"").trim(),
              stage: String(pick(r,["단계","stage"])||"").trim(),
              sub: String(pick(r,["호재내용","sub"])||"").trim(),
              note: String(pick(r,["메모","note"])||"").trim(),
              group: String(pick(r,["소분류","그룹","레이어","group","layer","큰그룹"])||"").trim(),
              _mid: String(pick(r,["중분류","mid","권역"])||"").trim(),
              _big: String(pick(r,["대분류","big","지역"])||"").trim(),
              _kx: parseFloat(pick(r,["x좌표","kx"])||""),
              _ky: parseFloat(pick(r,["y좌표","ky"])||""),
              seq: isNaN(seqRaw)?seqCounter:seqRaw,
              lat: isNaN(lat)?null:lat, lng: isNaN(lng)?null:lng,
              code: String(pick(r,["법정동코드","code"])||"").trim()
            });
          });

          // 중분류/대분류 명시된 항목 → midMap에 저장
          var mm = loadMidMap();
          var mmChanged = false;
          // 새 중분류 → LAYER_TREE_DEFAULT에 추가
          parsed.forEach(function(p){
            var big = p._big, mid = p._mid, grp = p.group;
            if(big && mid){
              // 소분류 있으면 소분류→중분류 매핑
              if(grp){ mm[grp]={big:big,mid:mid}; mmChanged=true; }
              // LAYER_TREE_DEFAULT에 없는 중분류면 추가
              var sec = null;
              for(var i=0;i<LAYER_TREE_DEFAULT.length;i++){
                if(LAYER_TREE_DEFAULT[i].big===big){ sec=LAYER_TREE_DEFAULT[i]; break; }
              }
              if(!sec){ // 대분류도 없으면 추가
                sec={big:big,mids:[]};
                LAYER_TREE_DEFAULT.push(sec);
              }
              var hasMid=false;
              for(var j=0;j<sec.mids.length;j++){if(sec.mids[j].mid===mid){hasMid=true;break;}}
              if(!hasMid){ sec.mids.push({mid:mid,keys:[]}); }
            } else if(grp && !big && !mid) {
              // 소분류만 있고 매핑 없으면 기존 매핑 유지
            }
            // _mid, _big은 삭제하지 않고 단지 객체에 유지 (레이어 분류용)
            // delete p._mid; delete p._big;
          });
          if(mmChanged) saveMidMap(mm);

          if (!parsed.length){ alert("넣을 수 있는 행이 없습니다.\n(이름과, 좌표 또는 주소가 있어야 합니다)"); return; }

          // 그룹명 비어있으면 기타로
          parsed.forEach(function(p){ if(!p.group) p.group="기타"; });

          var needGeo = parsed.filter(function(p){ return (p.lat==null||p.lng==null) && (p.addr||p.name); }).length;
          var needConv = parsed.filter(function(p){ return (p.lat==null||p.lng==null) && !isNaN(p._kx) && !isNaN(p._ky); }).length;
          var msg = parsed.length+"개를 지도에 넣습니다.";
          if (needConv) msg += "\n(좌표 "+needConv+"개는 자동 변환 — 시간이 좀 걸립니다)";
          if (skipped) msg += "\n(이름·좌표·주소 모두 없는 "+skipped+"개는 건너뜀)";
          msg += "\n\n[확인]=기존 추가분에 더하기 / [취소]=기존 추가분 교체";
          var append = confirm(msg);

          // WCONGNAMUL → WGS84 변환 (카카오 REST transcoord, 재시도 포함)
          var REST_KEY = "f5e811dd14d0ff8af54bdbb30219e1a5";
          function transcoord(x, y, retry){
            return fetch("https://dapi.kakao.com/v2/local/geo/transcoord.json?x="+x+"&y="+y+"&input_coord=WCONGNAMUL&output_coord=WGS84",
              { headers: { "Authorization": "KakaoAK "+REST_KEY } })
              .then(function(r){
                if (r.status===429 || r.status===503){ return "RETRY"; }
                return r.ok ? r.json() : null;
              })
              .then(function(j){
                if (j==="RETRY") return "RETRY";
                if (j && j.documents && j.documents.length){
                  return { lat: parseFloat(j.documents[0].y), lng: parseFloat(j.documents[0].x) };
                }
                return null;
              })
              .catch(function(){ return "RETRY"; })
              .then(async function(res){
                if (res==="RETRY" && (retry||0) < 3){
                  await new Promise(function(r){ setTimeout(r, 400*((retry||0)+1)); });
                  return transcoord(x, y, (retry||0)+1);
                }
                return res==="RETRY" ? null : res;
              });
          }

          // 좌표 없는 건 변환/지오코딩
          (async function(){
            var failList=[];
            var totalWork = parsed.filter(function(p){ return (p.lat==null||p.lng==null) && ((!isNaN(p._kx)&&!isNaN(p._ky)) || p.addr || p.name); }).length;
            if (totalWork){
              // 진행률 오버레이 표시
              var pBox=document.getElementById("progBox");
              var pBar=document.querySelector("#progBar > div");
              var pText=document.getElementById("progText");
              var pTitle=document.getElementById("progTitle");
              var pFail=document.getElementById("progFail");
              pTitle.textContent="좌표 변환 중…";
              pFail.innerHTML=""; pBar.style.width="0%"; pText.textContent="0 / "+totalWork;
              pBox.style.display="flex";

              var done=0, okc=0;
              var BATCH=5;
              for (var bi=0; bi<parsed.length; bi+=BATCH){
                var batch=parsed.slice(bi, bi+BATCH);
                await Promise.all(batch.map(async function(p){
                  if (p.lat!=null && p.lng!=null) return;
                  // 1) WCONGNAMUL 좌표 우선 변환
                  if (!isNaN(p._kx) && !isNaN(p._ky)){
                    var wgs=await transcoord(p._kx, p._ky);
                    if (wgs){ p.lat=wgs.lat; p.lng=wgs.lng; okc++; done++; return; }
                  }
                  // 2) 주소/이름 지오코딩 폴백
                  if (p.addr || p.name){
                    var geo=await geocodeOne(p.name, p.addr);
                    if (geo){ p.lat=geo.lat; p.lng=geo.lng; if(!p.code) p.code=geo.code; okc++; }
                    else { failList.push({name:p.name, addr:p.addr, group:p.group||"", land:p.land||0, jong:p.jong||"", note:p.note||"", seq:p.seq, score:p.score||0}); }
                    done++;
                  }
                }));
                pBar.style.width = Math.round(done/totalWork*100)+"%";
                pText.textContent = done+" / "+totalWork+"  (성공 "+okc+" · 실패 "+failList.length+")";
                if (failList.length){
                  pFail.innerHTML = "변환 실패: "+failList.slice(0,12).map(function(f){return f.name;}).join(", ")+(failList.length>12?" 외 "+(failList.length-12)+"개":"");
                }
                await new Promise(function(r){ setTimeout(r,60); });
              }
              pBox.style.display="none";
            }
            var imported = parsed.filter(function(p){ return p.lat!=null && p.lng!=null; })
                                 .map(function(p){ var o=Object.assign({},p); delete o.addr; return o; });
            if (!imported.length && !failList.length){ alert("좌표를 확정한 항목이 없습니다."); return; }
            if (append){
              // 같은 이름+그룹이면 덮어쓰기, 없으면 추가
              var dup=0, add=0;
              imported.forEach(function(p){
                // 이름+주소 기준 중복 체크 (둘 중 하나라도 다르면 다른 항목)
                var key=(p.name||"").trim()+"|"+((p.addr||"").trim());
                var idx=-1;
                for (var i=0;i<added.length;i++){
                  var ak=((added[i].name||"").trim()+"|"+((added[i].addr||"").trim()));
                  if(ak===key){ idx=i; break; }
                }
                if (idx>=0){ var oldId=added[idx].__id; p.__id=oldId; added[idx]=p; dup++; }
                else { added.push(p); add++; }
              });
              window.__lastImportMsg = "새로 추가 "+add+"개 · 덮어쓰기 "+dup+"개";
            }
            else { added = imported; window.__lastImportMsg=""; }
            saveAdded(added);
            saveFails(failList);   // 실패 목록 저장 → 우상단 버튼으로 확인
            renderFailBtn();       // 버튼 먼저 갱신 (renderAll 에러와 무관하게)
            renderAll();
            renderFailBtn();
            if (failList.length) alert("변환 실패 "+failList.length+"개는 우상단 '⚠ 실패' 버튼에서 확인하세요.");
            else if (window.__lastImportMsg) alert("완료: "+window.__lastImportMsg);
          })();
        } catch(err){
          alert("엑셀 읽기 실패: "+err.message);
        }
        document.getElementById("xlsxFile").value="";  // 같은 파일 재선택 가능하게
      };
      reader.readAsArrayBuffer(file);
    });

    // 현재 전체 항목을 places 코드 라인 문자열로 (export / GitHub저장 공용)
    function buildPlacesCode(){
      buildAll();
      function q(s){ return '"'+String(s==null?"":s).replace(/"/g,'\\"')+'"'; }
      return all.map(function(p){
        return '  { kind:'+q(p.kind)+', name:'+q(p.name)+', disp:'+q(p.disp)+', score:'+(p.score||0)+',\n' +
               '    py:'+q(p.py)+', price:'+q(p.price)+', land:'+(parseFloat(p.land)||0)+', jong:'+q(p.jong||"")+', stage:'+q(p.stage)+', sub:'+q(p.sub)+', spottype:'+q(p.spottype||"")+',\n' +
               '    note:'+q(p.note)+', group:'+q(p.group||"")+', seq:'+(p.seq!=null?p.seq:0)+', lat:'+Number(p.lat).toFixed(6)+', lng:'+Number(p.lng).toFixed(6)+', code:'+q(p.code)+' },';
      }).join("\n");
    }

    document.getElementById("exportBtn").addEventListener("click", function(){
      buildAll();
      if (!all.length){ alert("내보낼 항목이 없습니다."); return; }
      document.getElementById("exportText").value=buildPlacesCode();
      document.getElementById("exportBox").style.display="flex";
    });
    document.getElementById("copyBtn").addEventListener("click", function(){
      var t=document.getElementById("exportText"); t.select();
      try{ document.execCommand("copy"); this.textContent="복사됨!"; }catch(e){ alert("직접 선택해 복사하세요."); }
    });
    document.getElementById("closeExport").addEventListener("click", function(){
      document.getElementById("exportBox").style.display="none";
      document.getElementById("copyBtn").textContent="복사";
    });

    // ===== GitHub에 자동 저장 (data.js 갱신) =====
    var GH_OWNER  = "wg052026";
    var GH_REPO   = "my-budongsan-map";
    var GH_BRANCH = "main";          // 저장소 기본 브랜치 (main 또는 master)
    var GH_PATH   = "data.js";
    var GH_TOKEN_KEY = "budongsan_gh_token_v1";

    function ghToken(){
      var t = localStorage.getItem(GH_TOKEN_KEY) || "";
      if (!t){
        t = prompt("GitHub 토큰을 입력하세요. (한 번만 입력하면 이 기기에 저장됩니다)\n\nGitHub → Settings → Developer settings → Fine-grained tokens 에서\nmy-budongsan-map 저장소의 Contents = Read and write 권한으로 발급", "");
        if (t===null) return "";
        t = String(t).trim();
        if (t) localStorage.setItem(GH_TOKEN_KEY, t);
      }
      return t;
    }

    // UTF-8 → base64 (한글 안전)
    function toB64(str){
      return btoa(unescape(encodeURIComponent(str)));
    }

    document.getElementById("saveGhBtn").addEventListener("click", async function(){
      var btn=this;
      buildAll();
      if (!all.length){ alert("저장할 항목이 없습니다."); return; }
      var token = ghToken();
      if (!token){ return; }

      var fileText =
        "// 부동산 지도 데이터 — 지도의 'GitHub에 저장' 버튼이 자동 갱신합니다.\n" +
        "// 마지막 저장: " + new Date().toLocaleString("ko-KR") + " · 총 " + all.length + "개\n" +
        "window.PLACES = [\n" + buildPlacesCode() + "\n];\n";

      var apiBase = "https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/"+GH_PATH;
      var headers = { "Authorization":"Bearer "+token, "Accept":"application/vnd.github+json" };

      btn.disabled=true; var orig=btn.textContent; btn.textContent="저장 중…";
      try {
        // 1) 기존 파일 sha 조회 (있으면 업데이트, 없으면 신규)
        var sha = null;
        var getRes = await fetch(apiBase+"?ref="+GH_BRANCH, { headers: headers });
        if (getRes.status===200){ var info=await getRes.json(); sha=info.sha; }
        else if (getRes.status===401){ throw new Error("토큰이 거부됨(401). 토큰을 다시 입력하세요."); }
        else if (getRes.status===404){ sha=null; }  // 파일 신규 생성

        // 2) PUT 으로 커밋
        var body = {
          message: "지도 데이터 갱신 ("+all.length+"개) — "+new Date().toISOString(),
          content: toB64(fileText),
          branch: GH_BRANCH
        };
        if (sha) body.sha = sha;

        var putRes = await fetch(apiBase, { method:"PUT", headers: headers, body: JSON.stringify(body) });
        if (putRes.status===200 || putRes.status===201){
          btn.textContent="저장됨 ✓";
          setTimeout(function(){ btn.textContent=orig; btn.disabled=false; }, 2000);
          alert("GitHub에 저장 완료! ("+all.length+"개)\n\n잠시 후 공유 지도에 반영됩니다.\n(새로고침 시 data.js 캐시 때문에 1~2분 걸릴 수 있어요)");
        } else if (putRes.status===401){
          throw new Error("토큰이 거부됨(401). 토큰을 다시 입력하세요.");
        } else if (putRes.status===409){
          throw new Error("충돌(409). 다시 한 번 눌러보세요.");
        } else {
          var err=await putRes.text();
          throw new Error("저장 실패 ("+putRes.status+")\n"+err.slice(0,200));
        }
      } catch(e){
        btn.textContent=orig; btn.disabled=false;
        // 토큰 문제면 저장된 토큰 삭제하고 재입력 유도
        if (String(e.message).indexOf("401")>=0){ localStorage.removeItem(GH_TOKEN_KEY); }
        alert("GitHub 저장 오류:\n"+e.message);
      }
    });

    // 주소 → 좌표·법정동코드 변환 (엑셀 넣기에서 사용)
    // 단지명으로 장소 검색(정확) → 실패 시 주소로 폴백
    function geocodeOne(name, addr){
      return new Promise(function(resolve){
        var addrClean = (addr||"").replace(/\s*\([^)]*\)\s*$/,"").trim();
        // 주소에서 시/구 추출
        var region = "";
        var mm = addrClean.match(/(경기\s*\S+시|서울\S*구|\S+시\s*\S+구|\S+시|\S+군)/);
        if (mm) region = mm[1];
        // 검증용: 주소의 "시" 또는 "구" 핵심 토큰 (예: 화성시, 강남구)
        var keyTok = "";
        var km = addrClean.match(/(\S+시|\S+군|\S+구)/);
        if (km) keyTok = km[1];

        function finish(lat, lng){
          geocoder.coord2RegionCode(lng, lat, function(rc, st2){
            var code = "";
            if (st2===kakao.maps.services.Status.OK){
              var b=null; for (var k=0;k<rc.length;k++){ if(rc[k].region_type==="B"){ b=rc[k]; break; } }
              if (b && b.code) code = String(b.code).substring(0,5);
            }
            resolve({lat:lat, lng:lng, code:code});
          });
        }

        // 검색 결과가 주소의 시/군/구와 같은 지역인지 검증
        function regionOK(d){
          if (!keyTok) return true;   // 주소가 없으면 검증 못 함 → 통과
          var a = (d.road_address_name||d.address_name||"");
          return a.indexOf(keyTok) >= 0;
        }

        function tryPlace(query, next){
          if (!query){ next(); return; }
          ps.keywordSearch(query, function(data, status){
            if (status===kakao.maps.services.Status.OK && data && data.length){
              // 지역이 맞는 첫 결과 선택
              var hit=null;
              for (var i=0;i<data.length;i++){ if (regionOK(data[i])){ hit=data[i]; break; } }
              if (hit){ finish(parseFloat(hit.y), parseFloat(hit.x)); return; }
            }
            next();
          });
        }

        var nm = (name||"").trim();
        var q1 = nm ? (region? (region+" "+nm+" 아파트") : (nm+" 아파트")) : "";
        var q2 = nm ? (region? (region+" "+nm) : nm) : "";

        tryPlace(q1, function(){
          tryPlace(q2, function(){
            // 장소 검색 실패/지역 불일치 → 주소로 지오코딩 폴백
            if (addrClean){
              geocoder.addressSearch(addrClean, function(result, status){
                if (status===kakao.maps.services.Status.OK && result[0]){
                  finish(parseFloat(result[0].y), parseFloat(result[0].x));
                } else { resolve(null); }
              });
            } else { resolve(null); }
          });
        });
      });
    }

    document.getElementById("clearBtn").addEventListener("click", function(){
      if (!added.length && !Object.keys(edits).length){ alert("초기화할 변경분이 없습니다."); return; }
      if (!confirm("화면에서 한 추가·수정·삭제를 모두 되돌립니다.\n(코드의 고정 항목 원본만 남음)\n계속할까요?")) return;
      added=[]; saveAdded(added);
      edits={}; saveEdits(edits);
      resetPanel();
      renderAll();
    });
  });
  </script>

    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (err) {
